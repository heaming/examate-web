<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 메인 그라데이션 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    
    <!-- 내부 배경 -->
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- 메인 배경 (둥근 사각형) -->
  <rect x="0" y="0" width="128" height="128" rx="24" ry="24" fill="url(#mainGradient)" />
  
  <!-- 내부 배경 -->
  <rect x="12" y="12" width="104" height="104" rx="16" ry="16" fill="url(#innerBg)" />
  
  <!-- E 글자 -->
  <text x="64" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">E</text>
  
  <!-- 원형 (우측 상단) -->
  <circle cx="101" cy="27" r="8" fill="rgba(255,255,255,0.25)" />
  
  <!-- 네모 (하단 중앙에서 조금 우측) -->
  <rect x="77" y="101" width="16" height="16" rx="2" ry="2" fill="rgba(255,255,255,0.3)" />
  
  <!-- 세모 (좌측 중앙) -->
  <polygon points="20,64 28,52 28,76" fill="rgba(255,255,255,0.2)" />
</svg> 