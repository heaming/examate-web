<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 메인 그라데이션 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    
    <!-- 내부 배경 -->
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <!-- 메인 배경 (둥근 사각형) -->
  <rect x="0" y="0" width="32" height="32" rx="6" ry="6" fill="url(#mainGradient)" />
  
  <!-- 내부 배경 -->
  <rect x="3" y="3" width="26" height="26" rx="4" ry="4" fill="url(#innerBg)" />
  
  <!-- E 글자 -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">E</text>
  
  <!-- 원형 (우측 상단) -->
  <circle cx="25" cy="7" r="2" fill="rgba(255,255,255,0.3)" />
  
  <!-- 네모 (하단 우측) -->
  <rect x="20" y="25" width="4" height="4" rx="0.5" ry="0.5" fill="rgba(255,255,255,0.35)" />
  
  <!-- 세모 (좌측 중앙) -->
  <polygon points="5,16 8,13 8,19" fill="rgba(255,255,255,0.25)" />
</svg> 